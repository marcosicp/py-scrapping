<html>

<head>
	<title>Scrape</title>
	<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>

	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css">
	</link>

	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>


	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='assets/style.css')}}">
	</link>

	<script src="https://cdn.tailwindcss.com"></script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
		integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
		crossorigin="anonymous"></script>

	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						clifford: '#da373d',
					}
				}
			}
		}
	</script>

	<script type="text/javascript" charset="utf-8">
		var socket = io();
		socket.on("connect", function () {
		});

		// -- live state badges: one global channel carrying every snapshot.
		socket.on("scraper-status", function (data) {
			var badge = document.getElementById("state-" + data.slug);
			if (badge) {
				badge.textContent = data.state;
			}
		});

		// -- start a run; the POST URL is relative and rendered by the template.
		function buscar(superTarget, url) {
			var input = document.getElementById(superTarget + "-param");
			var category = input ? input.value : "";
			var fullUrl = category ? url + "?category=" + encodeURIComponent(category) : url;
			var Http = new XMLHttpRequest();
			Http.open("POST", fullUrl);
			Http.onreadystatechange = function () {
				if (Http.readyState === 4 && Http.status === 409) {
					setBadge(superTarget, "error: " + Http.responseText);
				}
			};
			Http.send();
		}

		// -- request a cooperative stop for an active run.
		function frenar(superTarget, url) {
			var Http = new XMLHttpRequest();
			Http.open("POST", url);
			Http.onreadystatechange = function () {
				if (Http.readyState === 4 && Http.status === 409) {
					setBadge(superTarget, "error: " + Http.responseText);
				}
			};
			Http.send();
		}

		function setBadge(superTarget, text) {
			var badge = document.getElementById("state-" + superTarget);
			if (badge) {
				badge.textContent = text;
			}
		}
	</script>
</head>

<body>
	<hr>

	<h1 class="font-bold text-3xl mt-5 mb-5 text-center">Carga de datos</h1>

	<div class="flex flex-col sm:flex-row ... text-center">
		{% for s in scrapers %}
		<div class="flex-1 ...">
			<h3>{{ s.label }}</h3>
			<span id="state-{{ s.slug }}" class="state-badge-{{ s.slug }}">idle</span>
			<button
				class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded shadow"
				onclick="buscar('{{ s.slug }}', '/scraping-{{ s.slug }}')">Scrapear</button>
			{% if s.categories %}
			<div class="form-control-wrapper">
				<input type="text" id="{{ s.slug }}-param" class="form-control floating-label"
					placeholder="Categoria">
			</div>
			{% endif %}
			<div class="progress-bar-{{ s.slug }}" style="width: 50%; margin: 50px"></div>
			<button
				class="bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2 px-4 border border-gray-400 rounded shadow"
				onclick="frenar('{{ s.slug }}', '/scraping-{{ s.slug }}-stop')">Frenar</button>
		</div>
		<script type="text/javascript" charset="utf-8">
			// -- progress for this card: one subscription, not one per click.
			socket.on("scraping-message-{{ s.slug }}", function (param) {
				$(".progress-bar-{{ s.slug }}")
					.append("<div>Procesando pagina: " + param + "</div>");
			});
		</script>
		{% endfor %}
	</div>
</body>

</html>
